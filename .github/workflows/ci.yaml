name: CI

on:
- push
- pull_request

jobs:
  unittest:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: run
      run: |
        sudo apt-get install -y make tox libapt-pkg-dev
        tox -e py3

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: lint
      run: |
        sudo apt-get install -y make tox libapt-pkg-dev
        tox -e py3-pyflakes,py3-flake8
